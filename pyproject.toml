[project]
name = "evidencegate"
version = "0.1.0"
description = "EvidenceGate Phase 1 Problem Evidence Auditor runtime"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.0.0",
  "openai>=2.53.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[project.scripts]
evidencegate-problem-audit = "evidencegate.problem_evidence.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
